name: release-scip

on:
  push:
    tags:
      - v*

jobs:
  release-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 24
      - run: npm install
      # npm pack builds the package and creates the tarball Dockerfile.autoindex installs.
      - run: cd ./packages/pyright-scip/ && npm install && npm pack
      - run: cd ./packages/pyright-scip/ && npm publish --access public
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        id: docker_build_autoindex
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.autoindex
          push: true
          tags: |
            sourcegraph/scip-python:autoindex
            sourcegraph/scip-python:latest
            sourcegraph/scip-python:${{ github.ref_name }}
